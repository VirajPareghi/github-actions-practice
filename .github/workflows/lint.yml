# what is the goal of t=your workflow
# Goal: Whenever someone changes the python code, the linter will check if the syntex, format, indentation (linting) is correct or not

name: Auto linter

on: 
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    # this step will automatically clone the code of the current branch into the runner
    steps:
      - name: Checkout/clone the code
        uses: actions/checkout@v7
